name: Sync Mirror
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyaxmlparser

      - name: Sync missing assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIRROR_REPO: wudishiduomojimo324/netamade-appstore-mirror
          SRC_REPO: z0brk/netamade-releases
          SRC_BRANCH: appstore
          RELEASE_TAG: appstore-202610
        run: python3 scripts/sync_mirror.py

      - name: Regenerate apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wudishiduomojimo324/netamade-appstore-mirror
          TAG: appstore-202610
        run: |
          mkdir -p /tmp/appsinfo
          cp mirror-manifest.json /tmp/appsinfo/manifest.json
          python3 scripts/generate_appsinfo.py
          cp /tmp/appsinfo/apps.json apps.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync mirror manifest, icons and apps.json" || echo "no changes to commit"
          git push
