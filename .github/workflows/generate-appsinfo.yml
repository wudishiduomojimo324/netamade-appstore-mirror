name: Generate apps.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyaxmlparser

      - name: Run generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wudishiduomojimo324/netamade-appstore-mirror
          TAG: appstore-202610
        run: |
          set -euo pipefail
          mkdir -p /tmp/appsinfo
          cp mirror-manifest.json /tmp/appsinfo/manifest.json
          python3 scripts/generate_appsinfo.py

      - name: Commit apps.json
        run: |
          cp /tmp/appsinfo/apps.json apps.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore: generate apps.json" || echo "no changes to commit"
          git push