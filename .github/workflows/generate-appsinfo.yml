name: Generate apps.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pyaxmlparser

      - name: Generate apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wudishiduomojimo324/netamade-appstore-mirror
          TAG: appstore-202610
          MANIFEST_B64: 
        run: |
          set -euo pipefail
          mkdir -p /tmp/appsinfo
          cd /tmp/appsinfo

          cat > manifest.json <<'EOF2'
__MANIFEST_PLACEHOLDER__
EOF2

          python <<'PY'
import json, os, base64, subprocess, tempfile

manifest_b64 = os.environ["MANIFEST_B64"]
repo = os.environ["REPO"]
tag = os.environ["TAG"]

items = json.loads(base64.b64decode(manifest_b64).decode("utf-8"))

# 按 dir 分组，每组取最大文件
by_dir = {}
for x in items:
    by_dir.setdefault(x["dir"], []).append(x)

# 读取仓库中已有 icons 列表（通过 API）
import urllib.request
token = os.environ.get("GH_TOKEN", "")

def gh_api(path):
    req = urllib.request.Request(f"https://api.github.com/repos/{repo}/{path}")
    req.add_header("Authorization", f"Bearer {token}")
    req.add_header("Accept", "application/vnd.github+json")
    with urllib.request.urlopen(req, timeout=60) as r:
        return json.loads(r.read().decode())

icons = []
try:
    for entry in gh_api("contents/icons"):
        icons.append(entry["name"])
except Exception as e:
    print("icons fetch error:", e)

# 下载并解析每个目录的最大 APK
from pyaxmlparser import APK

apps = []
for d in sorted(by_dir.keys()):
    files = by_dir[d]
    latest = max(files, key=lambda x: x["size"])
    asset = f"{d}__{latest['file']}"
    url = f"https://github.com/{repo}/releases/download/{tag}/{asset}"
    dst = os.path.join("/tmp/appsinfo", asset.replace("/", "_"))
    print(f"解析 {d} ({latest['file']}, {latest['size']/1048576:.1f}MB) ...", flush=True)
    meta = {}
    try:
        # 下载
        subprocess.run(
            ["gh", "release", "download", tag, "--repo", repo, "--pattern", asset,
             "--dir", "/tmp/appsinfo", "--clobber"],
            check=True, capture_output=True, timeout=600,
        )
        # 文件名为 asset
        apk_path = os.path.join("/tmp/appsinfo", asset)
        apk = APK(apk_path)
        meta = {
            "package": apk.package,
            "name": apk.application,
            "version": apk.version_name,
            "versionCode": apk.version_code,
        }
    except Exception as e:
        meta = {"error": str(e)[:200]}
    finally:
        try: os.remove(apk_path)
        except Exception: pass

    # 找图标
    icon = None
    for ic in icons:
        if ic.startswith(d + "."):
            icon = f"icons/{ic}"
            break

    apps.append({
        "code": d,
        "name": meta.get("name"),
        "package": meta.get("package"),
        "version": meta.get("version"),
        "versionCode": meta.get("versionCode"),
        "error": meta.get("error"),
        "icon": icon,
        "files": sorted(f["file"] for f in files),
        "latestFile": latest["file"],
        "latestSize": latest["size"],
        "latestUrl": url,
    })

# 写 apps.json
with open("/tmp/appsinfo/apps.json", "w", encoding="utf-8") as f:
    json.dump(apps, f, ensure_ascii=False, indent=1)

ok = sum(1 for a in apps if not a.get("error"))
print(f"apps.json 完成: {ok}/{len(apps)} 应用解析成功")
PY

      - name: Commit apps.json
        run: |
          cd /tmp/appsinfo
          python -c "print('apps.json generated')"
          cd "$GITHUB_WORKSPACE"
          cp /tmp/appsinfo/apps.json ./apps.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore: generate apps.json" || echo "no changes to commit"
          git push
