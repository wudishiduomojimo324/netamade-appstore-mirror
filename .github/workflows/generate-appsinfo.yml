name: Generate apps.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pyaxmlparser
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null 2>&1 || true

      - name: Generate apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: wudishiduomojimo324/netamade-appstore-mirror
          TAG: appstore-202610
        run: |
          set -euo pipefail
          mkdir -p /tmp/appsinfo
          cd /tmp/appsinfo

          # 从仓库读取 manifest
          cp "$GITHUB_WORKSPACE/mirror-manifest.json" ./manifest.json

          # 获取 release assets 列表（asset id 映射）
          gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.assets[] | {name: .name, id: .id}' > assets.json

          # 生成 apps.json
          python3 <<'PY'
import json, os, subprocess, urllib.request

repo = os.environ["REPO"]
tag = os.environ["TAG"]
token = os.environ.get("GH_TOKEN", "")

items = json.load(open("/tmp/appsinfo/manifest.json", encoding="utf-8"))
assets = json.load(open("/tmp/appsinfo/assets.json", encoding="utf-8"))
asset_id = {a["name"]: a["id"] for a in assets}

# 读取仓库 icons
def gh_api(path):
    req = urllib.request.Request(f"https://api.github.com/repos/{repo}/{path}")
    req.add_header("Authorization", f"Bearer {token}")
    req.add_header("Accept", "application/vnd.github+json")
    with urllib.request.urlopen(req, timeout=60) as r:
        return json.loads(r.read().decode())

icons = []
try:
    for entry in gh_api("contents/icons"):
        icons.append(entry["name"])
except Exception as e:
    print("icons error:", e)

# 按 dir 分组，每组取最大文件
by_dir = {}
for x in items:
    by_dir.setdefault(x["dir"], []).append(x)

from pyaxmlparser import APK

apps = []
for d in sorted(by_dir.keys()):
    files = by_dir[d]
    latest = max(files, key=lambda x: x["size"])
    asset_name = f"{d}__{latest['file']}"
    url = f"https://github.com/{repo}/releases/download/{tag}/{asset_name}"
    print(f"解析 {d} ({latest['file']}, {latest['size']/1048576:.1f}MB) ...", flush=True)
    meta = {}
    apk_path = None
    try:
        # 用 gh 下载指定 asset（通过 id，避免通配符问题）
        aid = asset_id.get(asset_name)
        if not aid:
            raise RuntimeError(f"asset not found: {asset_name}")
        gh api -H "Accept: application/octet-stream" \
            "repos/${REPO}/releases/assets/${aid}" > "${asset_name}" 2>/dev/null || true
        # gh api 二进制下载可能失败，改用 curl
        apk_path = f"/tmp/appsinfo/{asset_name.replace('/', '_')}"
        dl_url = f"https://github.com/{repo}/releases/download/{tag}/{asset_name}"
        subprocess.run(
            ["curl", "-sL", "--retry", "3", "-o", apk_path, dl_url],
            check=True, timeout=600,
        )
        apk = APK(apk_path)
        meta = {
            "package": apk.package,
            "name": apk.application,
            "version": apk.version_name,
            "versionCode": apk.version_code,
        }
    except Exception as e:
        meta = {"error": str(e)[:200]}
    finally:
        if apk_path:
            try: os.remove(apk_path)
            except Exception: pass

    icon = None
    for ic in icons:
        if ic.startswith(d + "."):
            icon = f"icons/{ic}"
            break

    apps.append({
        "code": d,
        "name": meta.get("name"),
        "package": meta.get("package"),
        "version": meta.get("version"),
        "versionCode": meta.get("versionCode"),
        "error": meta.get("error"),
        "icon": icon,
        "files": sorted(f["file"] for f in files),
        "latestFile": latest["file"],
        "latestSize": latest["size"],
        "latestUrl": url,
    })

with open("/tmp/appsinfo/apps.json", "w", encoding="utf-8") as f:
    json.dump(apps, f, ensure_ascii=False, indent=1)

ok = sum(1 for a in apps if not a.get("error"))
print(f"apps.json 完成: {ok}/{len(apps)} 应用解析成功")
PY

      - name: Commit apps.json
        run: |
          cp /tmp/appsinfo/apps.json "$GITHUB_WORKSPACE/apps.json"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore: generate apps.json" || echo "no changes to commit"
          git push
